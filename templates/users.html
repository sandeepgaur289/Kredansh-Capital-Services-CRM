{% extends 'base.html' %}{% set title='User Management' %}{% block body %}<div class="panel"><form method="post" action="/users/save"><input type="hidden" name="id" id="uid"><div class="formgrid"><input name="username" id="uu" placeholder="Login ID" required><input name="full_name" id="uf" placeholder="Full Name"><input name="password" type="password" placeholder="Password"><select name="role" id="ur">{% for x in roles %}<option>{{x}}</option>{% endfor %}</select><select name="status" id="us"><option>Active</option><option>Inactive</option></select></div><button class="gold" style="margin-top:8px">SAVE USER</button></form><div class="table-wrap" style="margin-top:14px"><table><tr><th>Login</th><th>Name</th><th>Role</th><th>Status</th><th>Last Login</th><th>Edit</th></tr>{% for r in rows %}<tr><td>{{r.username}}</td><td>{{r.full_name}}</td><td>{{r.role}}</td><td>{{r.status}}</td><td>{{r.last_login or ''}}</td><td><button onclick='editU({{r|tojson}})'>EDIT</button></td></tr>{% endfor %}</table></div></div><script>function editU(r){uid.value=r.id;uu.value=r.username;uf.value=r.full_name||'';ur.value=r.role||'Viewer';us.value=r.status||'Active'}</script>{% endblock %}
