{% extends 'base.html' %}{% set title='Daily Management Report' %}{% block body %}<div class="panel"><form><input type="date" name="date" value="{{date}}" style="max-width:220px;display:inline"><button>GENERATE</button></form><h2>{{date}}</h2><div class="cards"><div class="card"><small>Collection Received</small><strong>{{money(col.amount)}}</strong></div><div class="card"><small>Paid Cases</small><strong>{{col.c}}</strong></div><div class="card"><small>PTP</small><strong>{{ptp.c}}</strong></div><div class="card"><small>Visits</small><strong>{{vis.c}}</strong></div><div class="card"><small>Possessions</small><strong>{{pos.c}}</strong></div></div><button onclick="window.print()">PRINT / SAVE PDF</button></div>{% endblock %}
