{% extends 'base.html' %}{% set title='Case Documents & Photos' %}{% block body %}<div class="panel"><form method="post" enctype="multipart/form-data"><input type="file" name="file" required><button class="gold" style="margin-top:8px">UPLOAD DOCUMENT / PHOTO</button></form><h3>Files</h3>{% for f in files %}<p><a class="btn" target="_blank" href="{{url_for('docfile',module=module,rid=rid,name=f)}}">{{f}}</a></p>{% else %}<p>No files uploaded.</p>{% endfor %}</div>{% endblock %}
